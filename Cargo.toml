[package]
name = "carbang"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
avian3d = "0.7"
bevy = { version = "0.19.1", features = ["wav", "mp3", "jpeg", "tonemapping_luts", "smaa_luts"] }
bevy_hanabi = "0.19"
bincode = "1.3.3"
jpeg-decoder = { version = "0.3", default-features = false }
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
